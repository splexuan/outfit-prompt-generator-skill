interface:
  display_name: "穿搭提示词生成器"
  short_description: "为成年年轻女性设计梦幻少女感、华丽吸睛的AI影像服装提示词"
  default_prompt: "使用 $outfit-prompt-generator，为成年女性设计吸睛的 AI 影像服装提示词，或从人物参考图提取穿搭；图片反推默认输出同一套穿搭的整套陈列版和部件拆解版两版完整提示词。"

policy:
  allow_implicit_invocation: true

trust:
  source_tier: "local"
  network_access: "none"
  shell_execution: "none"
  filesystem_write: "none"
  file_reads: "skill-directory-only"
  remote_inline_execution: "forbid"
  remote_metadata_policy: "allow-metadata-only"
  notes: "纯指令型 Skill，仅读取自身 references/ 下的资料文件；不联网、不执行命令、不写入文件。出图由宿主提供的图像生成工具承担，平台参数以用户提供或平台官方文档为准，不凭记忆编造。"
